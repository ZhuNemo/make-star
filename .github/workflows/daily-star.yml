name: Daily Star

on:
  schedule:
    # 北京时间每天 03:00
    - cron: '0 19 * * *'
  workflow_dispatch:   # 也支持在 Actions 页面手动触发

permissions:
  contents: write      # 允许 push 回仓库

jobs:
  generate-star:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai   # 让脚本里的 date.today() 取北京日期
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate star SVG
        run: python make_star.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'star*.svg'
          if git diff --cached --quiet; then
            echo "没有新变化，跳过提交"
          else
            git commit -m "chore: add daily star ($(date +%F))"
            git push
          fi
